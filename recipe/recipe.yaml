schema_version: 1

context:
  name: wiscopy
  version: "0.2.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wiscopy-${{ version }}.tar.gz
  sha256: 3e280a5207344b39285930274b54dbe1c1e6a0d7da1a1a93722e7e011434924f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pydantic >=2.12.5,<3
    - httpx >=0.28.1,<1
    - pandas >=3.0.2,<4
    - aiolimiter >=1.2.1,<2
    - tqdm >=4.0

tests:
  - python:
      imports:
        - wiscopy
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file: LICENSE
  summary: Python wrapper for Wisconet
  homepage: https://github.com/UW-Madison-DSI/wiscopy
  repository: https://github.com/UW-Madison-DSI/wiscopy

extra:
  recipe-maintainers:
    - matthewfeickert
    - ilmcconnell
